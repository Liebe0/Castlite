name: Build APKs

# On every push / PR: run all tests, render UI screenshots, build debug APKs for the
# phone and TV apps, and upload everything as downloadable artifacts
# (Actions tab → a run → "Artifacts").
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle downloads and build outputs between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs every unit/integration test and records the Paparazzi screenshots.
      - name: Tests + screenshots
        run: ./gradlew --stacktrace :protocol:test :phone:recordPaparazziDebug :tv:recordPaparazziDebug

      - name: Build debug APKs
        run: ./gradlew --stacktrace :phone:assembleDebug :tv:assembleDebug

      - name: Rename APKs
        run: |
          mkdir -p out
          cp phone/build/outputs/apk/debug/phone-debug.apk out/CastLite-phone-debug.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk out/CastLite-tv-debug.apk

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: CastLite-phone-debug
          path: out/CastLite-phone-debug.apk
          if-no-files-found: error

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: CastLite-tv-debug
          path: out/CastLite-tv-debug.apk
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: CastLite-screenshots
          path: |
            phone/src/test/snapshots/images/
            tv/src/test/snapshots/images/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
